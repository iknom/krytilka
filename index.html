<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Колесо Фортуни - Ідеї подарунків</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: '#F4D0D2',
                        lilac: '#DAC5E2',
                        purple: '#977BB8',
                        beige: '#F3E2D6',
                        sage: '#AAB797',
                        dark: '#4D5D53',
                    },
                    fontFamily: {
                        segoe: ['"Segoe Print"', 'Comic Sans MS', 'cursive'],
                        fixel: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import maps need this polyfill on older mobile browsers -->
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.min.js" crossorigin="anonymous"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Custom Font Definitions */
        @font-face {
            font-family: 'Segoe Print';
            src: local('Segoe Print'), local('SegoePrint'), url('https://fonts.cdnfonts.com/s/14088/SegoePrint.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: #4D5D53;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
        }

        .wheel-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>

    <!-- Import Map for Modules -->
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
            "d3": "https://esm.sh/d3@7.9.0",
            "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2",
            "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
            "react/": "https://aistudiocdn.com/react@^19.2.1/"
          }
        }
    </script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
    import React, { useState, useEffect, useCallback } from 'react';
    import ReactDOM from 'react-dom/client';
    import * as d3 from 'd3';
    import confetti from 'canvas-confetti';
    import {
        Banknote,
        Utensils,
        Tv,
        Plane,
        Palette,
        Euro,
        Car,
        Coins,
        X,
        Gift,
        Wind,      // For Vacuum
        Zap,       // For Kettle
        Cloud,     // For Steam cleaner
        ChefHat,   // For Pan
        Scissors   // For Knives (metaphorical)
    } from 'lucide-react';

    // --- CONFIGURATION & DATA ---

    const PALETTE = {
        PINK: '#F4D0D2',
        LILAC: '#DAC5E2',
        PURPLE: '#977BB8',
        BEIGE: '#F3E2D6',
        SAGE: '#AAB797',
        DARK: '#4D5D53',
        TEXT_DARK: '#4D5D53',
        TEXT_WHITE: '#FFFFFF'
    };

    const THEME_COLORS = {
        background: PALETTE.DARK,
        button: '#8E70AF',
        buttonHover: '#7A5D9A',
        headerText: '#EAD8F0',
        confetti: [PALETTE.PINK, PALETTE.PURPLE, PALETTE.SAGE, PALETTE.BEIGE, PALETTE.LILAC]
    };


    const PRIZES = [
        {
            id: 'money',
            text: 'Гроші',
            color: PALETTE.SAGE,
            textColor: PALETTE.TEXT_DARK,
            icon: <Coins className="w-6 h-6" />,
            weight: 4,
        },
        {
            id: 'vacuum',
            text: 'Пилосос',
            color: PALETTE.BEIGE,
            textColor: PALETTE.TEXT_DARK,
            icon: <Wind className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'kettle',
            text: 'Електрочайник',
            color: PALETTE.LILAC,
            textColor: PALETTE.TEXT_DARK,
            icon: <Zap className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'euro',
            text: 'Євро',
            color: PALETTE.PURPLE,
            textColor: PALETTE.TEXT_WHITE,
            icon: <Euro className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'meat_grinder',
            text: "М'ясорубка",
            color: PALETTE.PINK,
            textColor: PALETTE.TEXT_DARK,
            icon: <Utensils className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'usd',
            text: 'Долари',
            color: PALETTE.SAGE,
            textColor: PALETTE.TEXT_DARK,
            icon: <Banknote className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'pan',
            text: 'Пательня',
            color: PALETTE.BEIGE,
            textColor: PALETTE.TEXT_DARK,
            icon: <ChefHat className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'knives',
            text: 'Набір ножів',
            color: PALETTE.LILAC,
            textColor: PALETTE.TEXT_DARK,
            icon: <Scissors className="w-6 h-6" />,
            weight: 1,
        },
        {
            id: 'steam',
            text: 'Пароочисник',
            color: PALETTE.PURPLE,
            textColor: PALETTE.TEXT_WHITE,
            icon: <Cloud className="w-6 h-6" />,
            weight: 1,
        }
    ];

    const getWeightedRandomIndex = (items) => {
        const totalWeight = items.reduce((sum, item) => sum + (item.weight ?? 1), 0);
        let threshold = Math.random() * totalWeight;

        for (let i = 0; i < items.length; i++) {
            threshold -= items[i].weight ?? 1;
            if (threshold <= 0) return i;
        }

        return items.length - 1;
    };

    // --- COMPONENTS ---

    const Wheel = ({ prizes, winningIndex, isSpinning, onSpinComplete }) => {
        const [rotation, setRotation] = useState(0);
        const WHEEL_SIZE = 500;
        const RADIUS = WHEEL_SIZE / 2;
        const SPIN_DURATION = 4000;

        const pie = d3.pie()
            .sort(null)
            .value(() => 1);

        const arc = d3.arc()
            .innerRadius(20)
            .outerRadius(RADIUS - 10);

        // Label arc positioned closer to center for radial text layout
        const labelArc = d3.arc()
            .innerRadius(RADIUS * 0.32)
            .outerRadius(RADIUS * 0.32);

        const arcs = pie(prizes);

        useEffect(() => {
            if (isSpinning && winningIndex !== null) {
                const segmentAngle = 360 / prizes.length;
                const winningAngle = (winningIndex * segmentAngle) + (segmentAngle / 2);

                const newRotation = Math.ceil(rotation / 360) * 360 + 1800 + (360 - winningAngle);

                setRotation(newRotation);

                const timer = setTimeout(() => {
                    onSpinComplete();
                }, SPIN_DURATION);

                return () => clearTimeout(timer);
            }
        }, [isSpinning, winningIndex, prizes.length, onSpinComplete]);

        return (
            <div className="relative flex justify-center items-center w-[90vw] max-w-[340px] md:max-w-[420px] aspect-square">
                {/* The Pointer */}
                <div className="absolute top-0 z-20 transform -translate-y-[40%] drop-shadow-md pointer-events-none">
                    <svg width="50" height="50" viewBox="0 0 60 60" fill="none">
                        <path d="M30 60L10 10H50L30 60Z" fill="#F3E2D6" stroke="#4D5D53" strokeWidth="2" />
                    </svg>
                </div>


                {/* The Wheel SVG */}
                <div className="rounded-full wheel-shadow border-4 border-beige/20 w-full h-full bg-dark">
                    <svg
                        viewBox={`0 0 ${WHEEL_SIZE} ${WHEEL_SIZE}`}
                        style={{
                            transform: `rotate(${rotation}deg)`,
                            transition: isSpinning ? `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0, 0.15, 1)` : 'none'
                        }}
                        className="w-full h-full"
                    >
                        <g transform={`translate(${RADIUS},${RADIUS})`}>
                            {arcs.map((d, i) => {
                                const [x, y] = labelArc.centroid(d);
                                // Rotate -90 degrees to align radially (center to edge)
                                const rotate = ((d.startAngle + d.endAngle) / 2 * (180 / Math.PI)) - 90;

                                return (
                                    <g key={prizes[i].id}>
                                        <path
                                            d={arc(d)}
                                            fill={prizes[i].color}
                                            stroke="#4D5D53"
                                            strokeWidth="1"
                                        />
                                        <g transform={`translate(${x},${y}) rotate(${rotate})`}>
                                            {/* Icon and Text Container - Aligned Left (which is Center visually) to Right (Edge) */}
                                            <foreignObject x="-12" y="-12" width="24" height="24">
                                                <div className="flex justify-center items-center w-full h-full" style={{ color: prizes[i].textColor }}>
                                                    {prizes[i].icon}
                                                </div>
                                            </foreignObject>
                                            <text
                                                x="20"
                                                y="5"
                                                textAnchor="start"
                                                fill={prizes[i].textColor}
                                                fontSize="14"
                                                fontWeight="800"
                                                className="font-fixel uppercase tracking-wider"
                                            >
                                                {prizes[i].text}
                                            </text>
                                        </g>
                                    </g>
                                );
                            })}
                        </g>
                        {/* Center Cap */}
                        <circle cx={RADIUS} cy={RADIUS} r="25" fill="#F3E2D6" className="shadow-sm" />
                        <circle cx={RADIUS} cy={RADIUS} r="8" fill="#977BB8" />
                    </svg>
                </div>
            </div>
        );
    };

    const ResultModal = ({ prize, isOpen, onClose }) => {
        useEffect(() => {
            if (isOpen) {
                const duration = 3000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 150, colors: THEME_COLORS.confetti };

                const randomInRange = (min, max) => Math.random() * (max - min) + min;

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);

                    const particleCount = 50 * (timeLeft / duration);
                    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
                }, 250);

                return () => clearInterval(interval);
            }
        }, [isOpen]);

        if (!isOpen) return null;


        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-dark/90 backdrop-blur-sm animate-in fade-in duration-300">
                <div className="bg-beige rounded-3xl p-6 md:p-8 max-w-sm w-full text-center relative shadow-2xl transform transition-all scale-100">

                    <button
                        onClick={onClose}
                        className="absolute top-4 right-4 text-dark/60 hover:text-dark transition-colors bg-white/50 rounded-full p-1"
                    >
                        <X className="w-5 h-5" />
                    </button>

                    <div className="mb-6 flex justify-center">
                        <div className="p-4 rounded-full bg-white animate-bounce shadow-md">
                            <Gift className="w-10 h-10 text-purple" />
                        </div>
                    </div>

                    <h2 className="font-segoe text-2xl text-dark mb-2">Підказка від долі!</h2>
                    <p className="font-fixel text-dark/80 mb-6 text-sm font-semibold">Молодятам варто подарувати:</p>

                    <div
                        className="font-fixel text-2xl md:text-3xl font-extrabold uppercase mb-8 py-6 px-4 rounded-xl border-4 border-dashed transform -rotate-1 shadow-sm bg-white"
                        style={{
                            color: prize.color === '#F3E2D6' || prize.color === '#F4D0D2' ? '#4D5D53' : prize.color,
                            borderColor: prize.color === '#F3E2D6' ? '#977BB8' : prize.color,
                        }}
                    >
                        {prize.text}
                    </div>

                    <button
                        onClick={onClose}
                        className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 font-fixel"
                        style={{ backgroundColor: THEME_COLORS.button }}
                    >
                        Чудова ідея!
                    </button>
                </div>
            </div>
        );
    };

    const App = () => {
        const [mustSpin, setMustSpin] = useState(false);
        const [winningIndex, setWinningIndex] = useState(null);
        const [showModal, setShowModal] = useState(false);
        const [history, setHistory] = useState([]);

        const handleSpinClick = useCallback(() => {
            if (!mustSpin && !showModal) {
                const newWinningIndex = getWeightedRandomIndex(PRIZES);
                setWinningIndex(newWinningIndex);
                setMustSpin(true);
            }
        }, [mustSpin, showModal]);

        const handleSpinComplete = () => {
            setMustSpin(false);
            setShowModal(true);
            if (winningIndex !== null) {
                setHistory(prev => [PRIZES[winningIndex].text, ...prev].slice(0, 5));
            }
        };

        const handleCloseModal = () => {
            setShowModal(false);
            setWinningIndex(null);
        };

        return (
            <div className="flex flex-col items-center justify-center p-4 relative overflow-visible w-full"
                 style={{ backgroundColor: THEME_COLORS.background }}>

                <div className="z-10 flex flex-col items-center w-full max-w-lg">

                    <div className="text-center mb-8">
                        <h1 className="font-segoe text-4xl md:text-5xl text-lilac mb-2 drop-shadow-md">
                            Ідеї подарунків
                        </h1>
                        <p className="font-fixel text-white text-base md:text-lg font-normal opacity-90">
                            Не знаєте що подарувати? Крутіть колесо!
                        </p>
                    </div>

                    <div className="relative w-full flex justify-center items-center py-4 mb-8">
                        <Wheel
                            prizes={PRIZES}
                            winningIndex={winningIndex}
                            isSpinning={mustSpin}
                            onSpinComplete={handleSpinComplete}
                        />
                    </div>


                    <button
                        onClick={handleSpinClick}
                        disabled={mustSpin}
                        className={`
                  font-fixel w-full max-w-xs py-4 rounded-xl text-xl font-bold text-white shadow-lg
                  transition-all duration-200 transform hover:shadow-xl active:scale-95
                  ${mustSpin ? 'opacity-70 cursor-wait' : 'hover:-translate-y-1'}
                `}
                        style={{
                            backgroundColor: mustSpin ? '#665c70' : THEME_COLORS.button,
                        }}
                    >
                        {mustSpin ? 'ОБИРАЄМО...' : 'Крутити!'}
                    </button>
                </div>

                {winningIndex !== null && (
                    <ResultModal
                        prize={PRIZES[winningIndex]}
                        isOpen={showModal}
                        onClose={handleCloseModal}
                    />
                )}
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
        <React.StrictMode>
            <App />
        </React.StrictMode>
    );
</script>
</body>
</html>
